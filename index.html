<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagos del Día del Circo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal-deep:#1c5c5f; --teal:#2fbfd0; --rojo:#d8342c; --rojo-osc:#a8241f;
  --crema:#fdf6ea; --crema-2:#f6e6cf; --tinta:#123f42; --tinta-2:#4d7c7f;
  --linea:#e6d9c2; --papel:#fffdf8; --ok:#1f7a4d; --ok-suave:#e2efda; --alerta:#b8560f; --oro:#c98a12;
  --titulo:"Baloo 2",system-ui,sans-serif; --texto:"Nunito",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--texto);color:var(--tinta);font-size:15px;
  background:radial-gradient(60% 45% at 12% 6%,#ffe9d2 0%,rgba(255,233,210,0) 60%),
             radial-gradient(55% 40% at 88% 10%,#d8f4f7 0%,rgba(216,244,247,0) 62%),var(--crema);
  background-attachment:fixed}
button{font:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- candado ---------- */
#candado{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.candado-caja{width:min(400px,100%);background:var(--papel);border:4px solid var(--teal-deep);border-radius:24px;
  padding:30px 26px;text-align:center;box-shadow:0 24px 50px -36px rgba(18,63,66,.9)}
.carpa{height:34px;margin:-30px -26px 22px;border-radius:20px 20px 0 0;
  background:repeating-linear-gradient(100deg,var(--rojo) 0 22px,#fff8f0 22px 44px);border-bottom:4px solid var(--teal-deep)}
.candado-caja h1{font-family:var(--titulo);font-size:28px;margin:0;color:var(--rojo-osc)}
.candado-caja p{color:var(--tinta-2);font-weight:700;margin:6px 0 20px}
.candado-caja input{width:100%;font:inherit;font-size:17px;font-weight:700;color:var(--tinta);
  border:3px solid var(--linea);border-radius:14px;padding:12px 14px;background:#fff;text-align:center}
.candado-caja input:focus{outline:none;border-color:var(--teal)}
.btn{font-family:var(--titulo);font-weight:800;font-size:17px;color:#fff;background:var(--rojo);border:none;
  border-bottom:5px solid var(--rojo-osc);border-radius:14px;padding:10px 26px}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.6;cursor:wait}
.candado-caja .btn{width:100%;margin-top:12px}
.candado-caja .error{color:var(--rojo-osc);font-weight:800;min-height:1.4em;margin:10px 0 0}
.sacudir{animation:sacudir .35s}
@keyframes sacudir{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* ---------- presentación ---------- */
#deck{display:none;height:100%;flex-direction:column}
#deck.abierto{display:flex}
.barra{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--papel);
  border-bottom:3px solid var(--teal-deep)}
.barra .marca{font-family:var(--titulo);font-weight:800;color:var(--rojo-osc);font-size:17px;white-space:nowrap}
.indice{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.indice::-webkit-scrollbar{display:none}
.indice button{flex:none;border:2px solid var(--linea);background:#fff;color:var(--tinta-2);border-radius:999px;
  padding:4px 12px;font-size:12.5px;font-weight:800}
.indice button.activa{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.diapos{flex:1;position:relative;overflow:hidden}
.diapo{position:absolute;inset:0;overflow-y:auto;padding:28px 16px 40px;display:none}
.diapo.activa{display:block;animation:entrar .25s ease-out}
@keyframes entrar{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lamina{max-width:980px;margin:0 auto}
.pie{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;
  background:var(--papel);border-top:3px solid var(--teal-deep)}
.pie .contador{font-weight:800;color:var(--tinta-2);font-size:13px}
.flecha{border:3px solid var(--teal-deep);background:#fff;color:var(--teal-deep);border-radius:12px;
  padding:6px 16px;font-weight:800}
.flecha:disabled{opacity:.35;cursor:default}

h2{font-family:var(--titulo);font-size:clamp(26px,4.5vw,40px);line-height:1.1;margin:0 0 6px;color:var(--rojo-osc)}
.bajada{color:var(--tinta-2);font-weight:700;margin:0 0 22px;max-width:70ch}
h3{font-family:var(--titulo);font-size:19px;margin:26px 0 10px;color:var(--teal-deep)}

/* portada */
.portada{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.portada .sobre{font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--tinta-2);font-size:13px}
.portada h2{font-size:clamp(38px,8vw,72px)}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:26px 0}
.cifra{background:var(--papel);border:3px solid var(--linea);border-radius:18px;padding:16px 18px}
.cifra span{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--tinta-2)}
.cifra b{display:block;font-family:var(--titulo);font-size:clamp(28px,4vw,36px);line-height:1.15}
.cifra small{color:var(--tinta-2);font-weight:700}
.cifra.azul{border-color:var(--teal-deep)} .cifra.azul b{color:var(--teal-deep)}
.cifra.oro{border-color:var(--oro)} .cifra.oro b{color:#8a5a00}
.cifra.ok{border-color:var(--ok)} .cifra.ok b{color:var(--ok)}
.cifra.rojo{border-color:var(--rojo)} .cifra.rojo b{color:var(--rojo-osc)}
.generado{color:var(--tinta-2);font-size:13px;font-weight:700}

/* progreso */
.progreso{background:var(--papel);border:3px solid var(--linea);border-radius:16px;padding:12px 16px;margin:0 0 18px;
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.progreso b{font-family:var(--titulo);font-size:18px}
.barrita{flex:1 1 200px;height:12px;background:var(--crema-2);border-radius:999px;overflow:hidden}
.barrita i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}

/* tarjeta de transferencia / efectivo */
.tarjetas{display:grid;gap:14px}
.tt{background:var(--papel);border:3px solid var(--teal-deep);border-radius:20px;overflow:hidden;transition:opacity .2s}
.tt.hecha{border-color:var(--ok);opacity:.62}
.tt-cab{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 16px;background:#fff}
.tt-nombre{font-family:var(--titulo);font-size:24px;font-weight:800;color:var(--rojo-osc);margin-right:auto}
.tt-monto{display:flex;align-items:center;gap:8px}
.tt-monto b{font-family:var(--titulo);font-size:30px;color:var(--teal-deep)}
.tt.hecha .tt-monto b{text-decoration:line-through;color:var(--ok)}
.hecho{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;cursor:pointer;
  border:2px solid var(--linea);border-radius:12px;padding:6px 12px;background:#fff;user-select:none}
.hecho input{width:20px;height:20px;accent-color:var(--ok);cursor:pointer;margin:0}
.tt.hecha .hecho{border-color:var(--ok);color:var(--ok);background:var(--ok-suave)}
.tt-cuerpo{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0;border-top:2px solid var(--linea)}
.tt-cuerpo>div{padding:12px 16px}
.tt-cuerpo>div+div{border-left:2px dashed var(--linea)}
@media (max-width:720px){.tt-cuerpo{grid-template-columns:1fr}.tt-cuerpo>div+div{border-left:none;border-top:2px dashed var(--linea)}}
.etq{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--tinta-2);margin:0 0 8px}
.datos{display:grid;grid-template-columns:max-content minmax(0,1fr) auto;gap:4px 10px;align-items:center;margin:0}
.datos dt{font-size:12.5px;font-weight:800;color:var(--tinta-2)}
.datos dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.copiar{width:34px;height:30px;border:2px solid var(--linea);background:#fff;color:var(--teal-deep);border-radius:9px;
  font-size:15px;line-height:1;padding:0;flex:none}
.copiar:hover{border-color:var(--teal)}
.copiar.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.copiar-todo{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.chico{border:2px solid var(--teal-deep);background:#fff;color:var(--teal-deep);border-radius:10px;padding:4px 12px;
  font-weight:800;font-size:13px}
.chico.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sello{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;border-radius:999px;padding:3px 12px}
.sello.banco{background:var(--ok-suave);color:var(--ok)}
.sello.falta{background:#fde3e1;color:var(--rojo-osc)}
.sello.def{background:#fff3cd;color:var(--alerta)}
.aviso-banco{margin:0 0 10px;font-size:13.5px;font-weight:700;color:var(--ok)}
.lineas{list-style:none;margin:0;padding:0;font-size:13.5px}
.lineas li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--linea)}
.lineas li:last-child{border-bottom:none}
.lineas .neg{color:var(--ok)}
.lineas em{font-style:normal;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;background:var(--crema-2);margin-right:6px}
.lineas .pagado{color:var(--ok);font-weight:800}

/* efectivo */
.caja-efectivo{border:3px solid var(--rojo);background:#fff6f5;border-radius:18px;padding:14px 18px;margin:0 0 18px}
.caja-efectivo.ok{border-color:var(--ok);background:#f4faf1}
.caja-efectivo .fila{display:flex;justify-content:space-between;gap:12px;font-weight:700;padding:3px 0}
.caja-efectivo .fila.total{border-top:2px solid var(--linea);margin-top:4px;padding-top:7px;font-weight:800;font-size:17px}
.caja-efectivo p{margin:8px 0 0;font-size:13.5px;font-weight:700;color:var(--tinta-2)}

/* informe */
.barras{display:grid;gap:10px;margin:8px 0 0}
.barra-cat{display:grid;grid-template-columns:150px 1fr 100px;align-items:center;gap:12px}
@media (max-width:560px){.barra-cat{grid-template-columns:1fr 90px}.barra-cat .riel{grid-column:1/-1;order:3}}
.barra-cat .nombre{font-weight:800}
.riel{height:22px;background:var(--crema-2);border-radius:8px;overflow:hidden}
.riel i{display:block;height:100%;border-radius:8px}
.barra-cat .num{text-align:right;font-weight:800}
.tabla{width:100%;border-collapse:collapse;font-size:14px;background:var(--papel);border-radius:14px;overflow:hidden}
.tabla th{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--tinta-2);text-align:left;
  padding:8px 10px;border-bottom:3px solid var(--linea)}
.tabla td{padding:7px 10px;border-bottom:1px solid var(--linea)}
.tabla .r{text-align:right}
.tabla tr.sub td{font-weight:800;background:#fff;border-bottom:3px solid var(--linea)}
.tabla tr.total td{font-weight:800;font-family:var(--titulo);font-size:17px;border-bottom:none}
.tabla-scroll{overflow-x:auto;border:3px solid var(--linea);border-radius:16px}
.cat{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.notas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.nota{background:var(--papel);border:3px solid var(--linea);border-radius:18px;padding:14px 16px}
.nota h4{font-family:var(--titulo);font-size:17px;margin:0 0 6px;color:var(--teal-deep)}
.nota p{margin:0 0 8px;font-size:13.5px;color:var(--tinta-2);font-weight:700}
.nota.alerta{border-color:var(--rojo)} .nota.alerta h4{color:var(--rojo-osc)}

#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--tinta);color:#fff;font-weight:800;padding:10px 18px;border-radius:12px;transition:.2s;z-index:9;
  max-width:calc(100% - 32px);text-align:center}
#toast.ver{opacity:1;transform:translate(-50%,0)}

button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media print{
  body{background:#fff}
  .barra,.pie,#toast,.hecho,.copiar,.copiar-todo,.progreso{display:none !important}
  #deck,.diapos{display:block !important;height:auto;overflow:visible}
  .diapo{display:block !important;position:static;overflow:visible;page-break-after:always;padding:0 0 20px}
  .tt{break-inside:avoid;opacity:1 !important}
}
</style>
</head>
<body>

<main id="candado">
  <form class="candado-caja" id="form-candado" autocomplete="off">
    <div class="carpa" aria-hidden="true"></div>
    <h1>Pagos · Día del Circo</h1>
    <p>Circo Lluvia · contenido protegido</p>
    <label for="clave" style="position:absolute;left:-9999px">Contraseña</label>
    <input id="clave" type="password" placeholder="Contraseña" autofocus required>
    <button class="btn" type="submit" id="entrar">Entrar</button>
    <p class="error" id="error" role="alert"></p>
  </form>
</main>

<div id="deck" aria-live="polite">
  <header class="barra">
    <span class="marca">Circo Lluvia</span>
    <nav class="indice" id="indice" aria-label="Diapositivas"></nav>
  </header>
  <div class="diapos" id="diapos"></div>
  <footer class="pie">
    <button class="flecha" id="atras" aria-label="Anterior">←</button>
    <span class="contador" id="contador"></span>
    <button class="flecha" id="adelante" aria-label="Siguiente">→</button>
  </footer>
</div>
<div id="toast" role="status"></div>

/* ---------- abrir con la contraseña ---------- */
async function descifrar(clave){
  if(!window.crypto || !crypto.subtle) throw new Error("sin-crypto");
  const b = s=> Uint8Array.from(atob(s), c=> c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const llave = await crypto.subtle.deriveKey(
    {name: "PBKDF2", salt: b(CIFRADO.sal), iterations: CIFRADO.iteraciones, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({name: "AES-GCM", iv: b(CIFRADO.iv)}, llave, b(CIFRADO.datos));
  return JSON.parse(new TextDecoder().decode(claro));
}

$("#form-candado").addEventListener("submit", async ev=>{
  ev.preventDefault();
  const boton = $("#entrar"), err = $("#error");
  boton.disabled = true; boton.textContent = "Abriendo…"; err.textContent = "";
  try{
    const datos = await descifrar($("#clave").value);
    $("#candado").remove();
    armar(datos);
  }catch(e){
    err.textContent = e.message === "sin-crypto"
      ? "Este navegador no permite descifrar acá. Abre el archivo directo desde la carpeta."
      : "Contraseña incorrecta.";
    const caja = $(".candado-caja");
    caja.classList.remove("sacudir"); void caja.offsetWidth; caja.classList.add("sacudir");
    $("#clave").select();
  }finally{ boton.disabled = false; boton.textContent = "Entrar"; }
});

/* ---------- copiar ---------- */
let toastT;
function toast(t){
  const el = $("#toast"); el.textContent = t; el.classList.add("ver");
  clearTimeout(toastT); toastT = setTimeout(()=> el.classList.remove("ver"), 1800);
}
async function copiar(texto){
  try{ await navigator.clipboard.writeText(texto); return true; }
  catch(e){
    const ta = Object.assign(document.createElement("textarea"), {value: texto});
    ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  }
}
document.addEventListener("click", async ev=>{
  const b = ev.target.closest("[data-copiar]");
  if(!b) return;
  const ok = await copiar(b.dataset.copiar);
  toast(ok ? `${b.dataset.rotulo || "Copiado"}: ${b.dataset.copiar.split("\n")[0]}${b.dataset.copiar.includes("\n") ? " …" : ""}` : "No pude copiar: selecciónalo a mano");
  if(ok){
    const antes = b.innerHTML; b.classList.add("ok"); b.innerHTML = b.classList.contains("copiar") ? "✓" : "✓ Copiado";
    setTimeout(()=>{ b.classList.remove("ok"); b.innerHTML = antes; }, 1300);
  }
});
const btnCopiar = (valor, rotulo)=> `<button type="button" class="copiar" data-copiar="${esc(valor)}" data-rotulo="${esc(rotulo)}" title="Copiar ${esc(rotulo.toLowerCase())}" aria-label="Copiar ${esc(rotulo.toLowerCase())}">⧉</button>`;

  secciones.push({titulo: "Informe: gasto", html: `
    <div class="lamina">
      <h2>Informe: todo lo gastado</h2>
      <p class="bajada">Cada peso contado una sola vez: lo que alguien adelantó de su bolsillo no se suma dos veces,
        y el fiado de la caja no es gasto.</p>
      <div class="cifras">
        <div class="cifra"><span>Gasto total</span><b class="num">${plata(I.total)}</b><small>${I.gasto.length} ítems</small></div>
        <div class="cifra"><span>Presupuesto original</span><b class="num">${plata(I.presupuesto_original)}</b><small>planilla del 09-09</small></div>
        <div class="cifra ${dif >= 0 ? "ok" : "rojo"}"><span>${dif >= 0 ? "Bajo el presupuesto" : "Sobre el presupuesto"}</span>
          <b class="num">${plata(Math.abs(dif))}</b><small>${(Math.abs(dif) / I.presupuesto_original * 100).toFixed(1).replace(".", ",")} %</small></div>
      </div>
      <h3>Por categoría</h3>
      <div class="barras">${cats.map(([c, m])=> `<div class="barra-cat">
        <span class="nombre"><span class="cat" style="background:${COLORES[c] || "#999"}"></span>${esc(c)}</span>
        <span class="riel"><i style="width:${(m / maximo * 100).toFixed(1)}%;background:${COLORES[c] || "#999"}"></i></span>
        <span class="num">${plata(m)}</span></div>`).join("")}</div>
    </div>`});

  // 5. informe: detalle
  const filasDetalle = cats.map(([c, m])=>{
    const items = I.gasto.filter(g=> g.categoria === c).sort((a, b)=> b.monto - a.monto);
    return items.map((g, i)=> `<tr><td>${i ? "" : `<span class="cat" style="background:${COLORES[c] || "#999"}"></span><b>${esc(c)}</b>`}</td>` +
      `<td>${esc(g.persona)}</td><td>${esc(g.concepto)}</td><td class="r num">${plata(g.monto)}</td></tr>`).join("") +
      `<tr class="sub"><td></td><td></td><td>Subtotal ${esc(c.toLowerCase())}</td><td class="r num">${plata(m)}</td></tr>`;
  }).join("");
  secciones.push({titulo: "Informe: detalle", html: `
    <div class="lamina">
      <h2>Detalle del gasto</h2>
      <p class="bajada">Todo lo gastado, por categoría y persona.</p>
      <div class="tabla-scroll"><table class="tabla">
        <thead><tr><th>Categoría</th><th>Persona</th><th>Concepto</th><th class="r">Monto</th></tr></thead>
        <tbody>${filasDetalle}
          <tr class="total"><td>TOTAL</td><td></td><td></td><td class="r num">${plata(I.total)}</td></tr></tbody>
      </table></div>
    </div>`});

  // 6. informe: notas
  const caja = D.efectivo_caja;
  secciones.push({titulo: "Informe: notas", html: `
    <div class="lamina">
      <h2>Notas del informe</h2>
      <p class="bajada">Lo que no entra en el gasto, y por qué.</p>
      <div class="notas">
        <div class="nota"><h4>Plata puesta de su bolsillo</h4>
          <p>Pagos que hizo alguien con su propia plata. El circo se la devuelve (está en la lista de pagos).</p>
          <ul class="lineas">${I.bolsillo.map(b=> `<li><span>${esc(b.quien)} → ${esc(b.a)} · ${esc(b.concepto)}</span><span class="num">${plata(b.monto)}</span></li>`).join("")}</ul>
        </div>
        <div class="nota"><h4>No se cuentan como gasto</h4>
          <p>Deudas que se pagan pero que no son un gasto nuevo.</p>
          <ul class="lineas">${I.excluidas.map(x=> `<li><span>${esc(x.persona)} · ${esc(x.concepto)}<br><small>${esc(x.porque)}</small></span><span class="num">${plata(x.monto)}</span></li>`).join("")}</ul>
        </div>
        <div class="nota"><h4>Fiado descontado</h4>
          <p>Lo que estas personas quedaron debiendo en la caja se restó de lo que se les paga.</p>
          <ul class="lineas">${I.fiado.map(f=> `<li><span>${esc(f.persona)}</span><span class="num neg">−${plata(f.monto)}</span></li>`).join("")}
            <li><b>Total</b><b class="num">−${plata(I.fiado.reduce((s, f)=> s + f.monto, 0))}</b></li></ul>
        </div>
        <div class="nota alerta"><h4>Faltante de caja: ${plata(caja.esperado - caja.contado)}</h4>
          <p>Debería haber ${plata(caja.esperado)} en efectivo: ${plata(caja.ventas)} de ventas según la caja,
            más ${plata(caja.sencillo)} de sencillo que puso Sole (la caja-app no lo cuenta).
            Se contaron ${plata(caja.contado)}. Probable merma y errores al dar vuelto; no se puede
            comprobar con los datos de la caja. No está sumado al gasto.</p>
        </div>
        ${I.sin_datos.length ? `<div class="nota alerta"><h4>Pendiente para transferir</h4>
          <p>Sin datos de transferencia ni guardados en el banco: <b>${I.sin_datos.map(esc).join(", ")}</b>.</p></div>` : ""}
      </div>
    </div>`});

  // montar
  diapos = secciones;
  $("#diapos").innerHTML = secciones.map((s, i)=> `<section class="diapo" id="d${i}" aria-label="${esc(s.titulo)}">${s.html}</section>`).join("");
  $("#indice").innerHTML = secciones.map((s, i)=> `<button type="button" data-ir="${i}">${esc(s.titulo)}</button>`).join("");
  $("#deck").classList.add("abierto");
  pintarProgreso();
  const desdeHash = parseInt(location.hash.slice(1), 10) - 1;
  ir(Number.isInteger(desdeHash) && desdeHash >= 0 && desdeHash < secciones.length ? desdeHash : 0);
}

function pintarProgreso(){
  for(const el of document.querySelectorAll("[data-progreso]")){
    const tarjetas = [...el.parentElement.querySelectorAll(".tt")];
    const hechas = tarjetas.filter(t=> t.classList.contains("hecha"));
    const monto = t=> Number(t.dataset.hecho.split("|").pop());
    const total = tarjetas.reduce((s, t)=> s + monto(t), 0), listo = hechas.reduce((s, t)=> s + monto(t), 0);
    const verbo = el.dataset.progreso === "tef" ? "transferidas" : "entregados";
    el.innerHTML = `<b>${hechas.length} de ${tarjetas.length}</b> <span>${verbo} · ${plata(listo)} de ${plata(total)}</span>` +
      `<span class="barrita"><i style="width:${total ? (listo / total * 100) : 0}%"></i></span>`;
  }
}

document.addEventListener("change", ev=>{
  const c = ev.target.closest(".hecho input");
  if(!c) return;
  const tarjeta = c.closest("[data-hecho]"), k = tarjeta.dataset.hecho;
  if(c.checked) hechos[k] = new Date().toISOString(); else delete hechos[k];
  guardarHechos();
  tarjeta.classList.toggle("hecha", c.checked);
  pintarProgreso();
});

/* ---------- navegación ---------- */
function ir(i){
  if(!diapos.length) return;
  actual = Math.max(0, Math.min(diapos.length - 1, i));
  document.querySelectorAll(".diapo").forEach((d, j)=> d.classList.toggle("activa", j === actual));
  document.querySelectorAll("#indice button").forEach((b, j)=>{
    b.classList.toggle("activa", j === actual);
    if(j === actual) b.scrollIntoView({block: "nearest", inline: "nearest"});
  });
  $("#contador").textContent = `${actual + 1} / ${diapos.length} · ${diapos[actual].titulo}`;
  $("#atras").disabled = actual === 0;
  $("#adelante").disabled = actual === diapos.length - 1;
  history.replaceState(null, "", "#" + (actual + 1));
  $("#d" + actual).scrollTop = 0;
}
$("#indice").addEventListener("click", ev=>{ const b = ev.target.closest("[data-ir]"); if(b) ir(+b.dataset.ir); });
$("#atras").addEventListener("click", ()=> ir(actual - 1));
$("#adelante").addEventListener("click", ()=> ir(actual + 1));
document.addEventListener("keydown", ev=>{
  if(!diapos.length || ev.target.closest("input,textarea,select") || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if(ev.key === "ArrowRight" || ev.key === "PageDown"){ ev.preventDefault(); ir(actual + 1); }
  if(ev.key === "ArrowLeft" || ev.key === "PageUp"){ ev.preventDefault(); ir(actual - 1); }
});
let toque = null;
document.addEventListener("touchstart", ev=>{ toque = ev.touches[0]; }, {passive: true});
document.addEventListener("touchend", ev=>{
  if(!toque || !diapos.length) return;
  const t = ev.changedTouches[0], dx = t.clientX - toque.clientX, dy = t.clientY - toque.clientY;
  toque = null;
  if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && !ev.target.closest(".tabla-scroll,.indice"))
    ir(actual + (dx < 0 ? 1 : -1));
}, {passive: true});
</script>
</body>
